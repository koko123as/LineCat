[package]
name = "seasoncat_ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "SeasonCat's Slint UI for Android; talks to the Kotlin shell over a local socket."

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[dependencies]
slint = { version = "=1.19.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }
flate2 = "1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
png = "0.17"
resvg = { version = "=0.49.0", default-features = false, features = ["raster-images"] }
rquickjs = { version = "0.12", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
# rquickjs ships pre-generated bindings for every target but Android, where the build
# generates them.
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }

[build-dependencies]
slint-build = "=1.19.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Only for examples/snapshot.rs, which renders the pages to PNG on a desktop.
slint = { version = "=1.19.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
