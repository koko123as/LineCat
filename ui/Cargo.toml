[package]
name = "seasoncat_ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "SeasonCat's Slint UI for Android; talks to the Kotlin shell over a local socket."

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[dependencies]
slint = { version = "=1.19.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }
flate2 = "1"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }

[build-dependencies]
slint-build = "=1.19.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
