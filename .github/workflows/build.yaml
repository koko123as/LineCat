name: build

on:
  push:
    # slint-ui is built by slint-android.yaml.
    branches-ignore:
      - slint-ui
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  # See CI Caches in .agents/commands.md.
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  NDK_VERSION: r28c
  # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
  CA_BUNDLE: cacert-2026-09-25.pem
  CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505

jobs:
  hooks:
    name: Git hooks
    # A private copy pays for its Actions minutes, so it runs the checks only when
    # started by hand.
    if: &checks github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test git hooks
        run: bash tool/hooks/test.sh

  android:
    name: Android unit tests
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - &fetch-ca
        name: Fetch CA certificates
        shell: bash
        run: |
          bundle=concord/assets/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle version
        id: gradle-version
        run: echo "version=$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-\(all\|bin\)\.zip$/\1/p' android/gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # `:core` builds the Rust library, so one ABI of it is built.
          gradle --no-daemon :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest :core:testDebugUnitTest \
            -Ptarget-platform=android-arm64

  rust:
    name: Rust
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path android/core/jni/Cargo.toml -- --check

      - name: Run tests
        run: cargo test --manifest-path services/helper/Cargo.toml

  rust-core:
    name: Rust core
    if: *checks
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # The release budget in bytes for the desktop Core.
      CORE_MAX_BYTES: 30000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: concord
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - *fetch-ca

      - name: Check format
        working-directory: concord
        run: cargo fmt --check

      - name: Clippy
        working-directory: concord
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        working-directory: concord
        run: cargo test --workspace

      - name: Check crate layers
        working-directory: concord
        run: cargo run -p xtask -- check-layers

      - name: Check generated schema
        working-directory: concord
        run: cargo run -p xtask -- schema --check

      - name: Check dependencies
        working-directory: concord
        run: cargo deny check

      - name: Build release core
        working-directory: concord
        run: cargo build --release -p concord-desktop

      - name: Check binary size
        working-directory: concord
        run: cargo run -p xtask -- check-size target/release/concord "$CORE_MAX_BYTES"

  windows-helper-test:
    name: Windows helper test
    if: *checks
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service
